name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npm run type-check

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      # IMMUTABLE: must be `npm run format` (--write), NOT format:check.
      # Pre-commit hook runs lint-staged which formats on commit, but AI agents
      # and manual edits can bypass hooks. CI auto-formats so the build never
      # fails on whitespace — the subsequent `git diff --exit-code` would catch
      # meaningful drift if needed. Do NOT change to format:check.
      - name: Format (Prettier)
        run: npm run format

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: ${{ !cancelled() }}
        with:
          directory: coverage/
          flags: unittests
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run build:check-size

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
