name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Type check
        run: pnpm run type-check

      - name: Lint (ESLint + Stylelint)
        run: pnpm run lint

      # IMMUTABLE: must be `pnpm run format` (--write), NOT format:check.
      # Pre-commit hook runs lint-staged which formats on commit, but AI agents
      # and manual edits can bypass hooks. CI runs the formatter in write mode
      # so the human-facing error message points at the fix ("run pnpm run
      # format locally and push") rather than at Prettier's opaque diff output.
      - name: Format (Prettier)
        run: pnpm run format

      # Fail the build when CI's auto-format produced any changes. This turns
      # the ratchet on: formatting drift on a PR branch is a hard gate, not a
      # silent in-runner rewrite that disappears when the runner tears down.
      - name: Verify no formatting drift
        run: |
          if ! git diff --exit-code; then
            echo "::error title=Formatting drift detected::Run 'pnpm run format' locally and commit the result."
            exit 1
          fi

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: ${{ !cancelled() }}
        with:
          directory: coverage/
          flags: unittests
          fail_ci_if_error: false

      - name: Build
        run: pnpm run build

      - name: Bundle size check
        run: pnpm run build:check-size

  # E2E tests disabled in CI — cancel-in-progress kills long-running
  # Playwright runs on every push, so they never complete. Run locally
  # with `pnpm run test:e2e` before merging.

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lighthouse CI
        run: pnpm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
